[general]
resource_parser_url = https://cdn.jsdelivr.net/gh/KOP-XIAO/QuantumultX@master/Scripts/resource-parser.js
network_check_url = http://www.apple.com/library/test/success.html
server_check_url = http://cp.cloudflare.com/generate_204
geo_location_checker=http://ip-api.com/json/?lang=zh-CN, https://raw.githubusercontent.com/Orz-3/Orz-3/master/QuantumultX/IP.js
dns_exclusion_list = *.cmpassport.com, *.jegotrip.com.cn, *.icitymobile.mobi, id6.me, *.pingan.com.cn, *.cmbchina.com
udp_drop_list = 443
excluded_routes = 239.255.255.250/32
icmp_auto_reply = true

[dns]
no-system
doh-server = https://223.5.5.5/dns-query, https://1.12.12.12/dns-query

[policy]
available=TOP, server-tag-regex=LAX, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/Catnet.png
static=Final, direct, TOP, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/Socloud.png

[server_remote]

[filter_remote]
https://raw.githubusercontent.com/wsc82/QuantumultX/main/Ruleset/Global.list, tag=Global, force-policy=TOP, update-interval=172800, opt-parser=false, enabled=true
https://raw.githubusercontent.com/wsc82/QuantumultX/main/Ruleset/Domestic.list, tag=Domestic, force-policy=direct, update-interval=172800, opt-parser=false, enabled=true
https://raw.githubusercontent.com/wsc82/QuantumultX/main/Ruleset/Catchall.list, tag=Catchall, force-policy=Final, update-interval=172800, opt-parser=false, enabled=true

[rewrite_remote]
https://raw.githubusercontent.com/Aioneas/Surge/main/Module/youtube.aioneas.hide-shorts.sgmodule, tag=油管去广告, update-interval=172800, opt-parser=true, enabled=true

[server_local]

[filter_local]
host-suffix, local, direct
ip-cidr, 192.168.0.0/16, direct
ip-cidr, 10.0.0.0/8, direct
ip-cidr, 172.16.0.0/12, direct
ip-cidr, 127.0.0.0/8, direct
ip-cidr, 100.64.0.0/10, direct
ip-cidr, 224.0.0.0/4, direct
ip6-cidr, fe80::/10, direct
geoip, cn, direct
final, Final

[rewrite_local]
^https?:\/\/(www.)?(g|google)\.cn url 302 https://www.google.com

[task_local]
event-interaction https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/streaming-ui-check.js, tag=流媒体解锁查询, img-url=arrowtriangle.right.square.system, enabled=true

[http_backend]

[mitm]
skip_validating_cert = false
hostname = www.google.cn
